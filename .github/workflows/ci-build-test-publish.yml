name: CI (Build universal wheel + Test + Publish)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  # 1) Build sdist + universal wheel (pure Python)
  build_dist:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel --outdir dist

      - name: Check distribution metadata
        run: twine check --strict dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/*

  # 2) Test from source on all OS/Python
  test_source:
    name: Test (source) py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ '3.12', '3.13', '3.14', '3.15' ]
        # PuLP 4.0.1 only ships cp315 wheels for Linux, and its source
        # build fails on Windows/macOS. Re-enable once PuLP publishes them.
        exclude:
          - { os: macos-latest, python-version: '3.15' }
          - { os: windows-latest, python-version: '3.15' }
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: "pip"

      - name: Install package (from source)
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install ".[polars]" || true
          # torch (via sentence-transformers) may lag new Python releases;
          # the embedding tests skip when it is not installed.
          pip install ".[embeddings]" || true

      - name: Install test deps
        run: pip install pytest==9.1.1

      - name: Run tests
        run: python -m pytest -q tests

  # 3) Test the built wheel on all OS/Python
  test_wheel:
    name: Test (wheel) py${{ matrix.python-version }} on ${{ matrix.os }}
    needs: [ build_dist ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ '3.12', '3.13', '3.14', '3.15' ]
        # PuLP 4.0.1 only ships cp315 wheels for Linux, and its source
        # build fails on Windows/macOS. Re-enable once PuLP publishes them.
        exclude:
          - { os: macos-latest, python-version: '3.15' }
          - { os: windows-latest, python-version: '3.15' }
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: "pip"

      - name: Download built dists
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Install built wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Prefer wheel; fall back to sdist if needed
          WHEEL=$(ls dist/*.whl | head -n 1 || true)
          if [ -n "$WHEEL" ]; then
            pip install "$WHEEL"
          else
            pip install dist/*.tar.gz
          fi
          pip install polars || true
          pip install "sentence-transformers>=2.0,<7.0" || true

      - name: Install test deps
        run: pip install pytest==9.1.1

      # tests/ is a package, so pytest puts the repo root on sys.path and
      # would import the source tree instead of the installed wheel.
      - name: Remove source package from checkout
        shell: bash
        run: rm -rf valentine

      - name: Run tests (against installed wheel)
        shell: bash
        run: |
          python -c "import valentine, sys; print(valentine.__file__); sys.exit('site-packages' not in valentine.__file__)"
          python -m pytest -q tests

  # 4) Publish to PyPI on Release (tag publish event)
  publish-to-pypi:
    name: Publish to PyPI
    needs: [ build_dist, test_source, test_wheel ]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for Trusted Publishers (OIDC)
      contents: read
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      # A) Trusted Publisher / OIDC
      - name: Publish (PyPI via OIDC)
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
          verify-metadata: true
          skip-existing: false
