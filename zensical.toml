# ============================================================================
# Zensical configuration for the Valentine documentation site.
# Full reference: https://zensical.org/docs/
# ============================================================================

[project]

site_name = "Valentine"
site_description = "Schema matching for pandas and Polars DataFrames — made easy."
site_author = "Delft Data"
site_url = "https://delftdata.github.io/valentine/"
copyright = """
Copyright &copy; 2026 Delft Data
"""

repo_name = "delftdata/valentine"
repo_url = "https://github.com/delftdata/valentine"

extra_css = ["assets/extra.css"]
extra_javascript = [
    "assets/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

nav = [
    { "Home" = "index.md" },
    { "Getting started" = "getting-started.md" },
    { "Matchers" = "matchers.md" },
    { "Matcher results" = "results.md" },
    { "Evaluation metrics" = "metrics.md" },
    { "Full example" = "example.md" },
    { "API reference" = "api.md" },
    { "FAQ" = "faq.md" },
    { "What's new in v1.0.0" = "blog-v100.md" },
    { "Benchmark" = "benchmark.md" },
    { "Changelog" = "changelog.md" },
    { "Research" = "research.md" },
]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]

custom_dir = "overrides"
language = "en"

features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

logo = "assets/logo.png"
favicon = "assets/favicon.png"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "pink"
accent = "pink"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "pink"
accent = "pink"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# ----------------------------------------------------------------------------
# Social links in the footer
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/delftdata/valentine"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/valentine/"

# ----------------------------------------------------------------------------
# Plugins
# ----------------------------------------------------------------------------
[project.plugins.social]

[project.plugins.minify]
minify_html = true

[project.plugins.llmstxt]

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_source = false
show_root_heading = true
show_root_toc_entry = false
separate_signature = true
show_signature_annotations = true
merge_init_into_class = true
members_order = "source"
